<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Masume">
  <!--
    The same 升目 grid as icon.svg, drawn smaller.

    Android crops a launcher icon to whatever shape the device uses — a circle, a
    squircle, a rounded square — and only guarantees the middle 80%: a circle of
    radius 205 around the centre. The full-size grid reaches 254 from the centre
    at its corners, so on a circular launcher the four corner cells were sliced
    off and the icon read as a broken rectangle.

    At this size the corners sit 203 from the centre, just inside the guarantee.
    The background deliberately covers the whole canvas, because the crop keeps
    whatever it lands on and a transparent edge would show the launcher through.

    Kept as a separate file rather than one icon serving both: shrinking the
    normal icon to survive a crop that most surfaces never apply would waste a
    fifth of every place it is shown at full size.
  -->
  <rect width="512" height="512" fill="#E7E1D8"/>
  <g transform="translate(112 112)">
    <!-- done -->
    <rect x="0"   y="0"   width="83" height="83" rx="3" fill="#211D1A"/>
    <rect x="102" y="0"   width="83" height="83" rx="3" fill="#211D1A"/>
    <rect x="204" y="0"   width="83" height="83" rx="3" fill="#211D1A"/>
    <rect x="0"   y="102" width="83" height="83" rx="3" fill="#211D1A"/>
    <rect x="102" y="102" width="83" height="83" rx="3" fill="#211D1A"/>
    <rect x="204" y="102" width="83" height="83" rx="3" fill="#211D1A"/>
    <!-- the cell you are on -->
    <rect x="0"   y="204" width="83" height="83" rx="3" fill="none" stroke="#CE3F29" stroke-width="11"/>
    <!-- still to come -->
    <rect x="102" y="204" width="83" height="83" rx="3" fill="none" stroke="#CEC6B8" stroke-width="8" stroke-dasharray="18 13"/>
    <rect x="204" y="204" width="83" height="83" rx="3" fill="none" stroke="#CEC6B8" stroke-width="8" stroke-dasharray="18 13"/>
  </g>
</svg>
